name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/dev.txt

      - name: Install package with dev extras (locked)
        run: |
          python -m pip install --upgrade pip
          pip install -c requirements/dev.txt -e '.[dev]'

      - name: Ruff
        run: ruff check src tests

      - name: Mypy
        run: mypy

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      # Fail closed on any known vulnerability in the locked runtime set that
      # the container image installs.
      - name: Audit locked runtime dependencies
        run: pip-audit --strict --disable-pip -r requirements/runtime.txt

      - name: Check the lock matches pyproject.toml
        run: |
          python -m pip install uv==0.11.32
          scripts/lock.sh
          git diff --exit-code -- requirements/ \
            || { echo "::error::requirements/ is stale; run scripts/lock.sh"; exit 1; }

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/dev.txt

      - name: Install package with dev extras (locked)
        run: |
          python -m pip install --upgrade pip
          pip install -c requirements/dev.txt -e '.[dev]'

      - name: Configure git identity (audit-trail tests commit)
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"

      - name: Run tests with coverage
        run: python -m pytest -q --cov --cov-report=term --cov-report=xml

      # The authorization path is held to a much higher bar than the package
      # as a whole (see [tool.coverage] in pyproject.toml for the overall floor).
      - name: Enforce coverage on authorization modules
        run: >
          coverage report --fail-under=95
          --include='src/cortex/access.py,src/cortex/scopes.py,src/cortex/memory_policy.py,src/cortex/db/vault_grants.py'

      - name: Upload coverage report
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  image:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cortex:ci .
      - run: scripts/smoke-v2.sh cortex:ci
