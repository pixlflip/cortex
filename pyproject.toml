[project]
name = "cortex-memory"
version = "0.3.0"
description = "A governed Obsidian-vault memory layer for AI agents, served over MCP."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Cortex contributors" }]
keywords = ["mcp", "memory", "vault", "obsidian", "agents", "chatbots", "ai"]

dependencies = [
    "mcp>=1.25.0,<2",
    "httpx>=0.27,<1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40.0"]
openai = ["openai>=1.0.0"]
ldap = ["ldap3>=2.9"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "pip-audit>=2.7",
]

[project.scripts]
cortex = "cortex.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cortex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "e2e: drives a real Cortex MCP server over stdio or HTTP",
]

[tool.coverage.run]
source = ["cortex"]
branch = true

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# Correctness-focused: pyflakes, syntax errors, bugbear and pylint errors.
# Style rules are deliberately left off to avoid churn on existing code.
select = ["F", "E9", "B", "PLE"]
# API handlers intentionally raise uniform errors without chaining causes.
ignore = ["B904"]

[tool.mypy]
python_version = "3.11"
files = ["src/cortex"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

# Authorization-critical modules are checked strictly.
[[tool.mypy.overrides]]
module = [
    "cortex.access",
    "cortex.scopes",
    "cortex.memory_policy",
    "cortex.db.vault_grants",
]
# Equivalent to --strict (which mypy does not accept per module).
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
check_untyped_defs = true
no_implicit_reexport = true
warn_return_any = true
strict_equality = true
